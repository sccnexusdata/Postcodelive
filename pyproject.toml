[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postcodelive"
version = "0.2.0"
description = "Reusable postcode-first locality orchestration layer for LewesLive and future Live sites"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
